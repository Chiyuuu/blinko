name: Build Custom Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.8.8)'
        required: false
        default: '1.8.8'
  push:
    branches:
      - main
      - master
    paths:
      - 'app/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27b
          link-to-sdk: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Increase Node memory limit
        run: echo "NODE_OPTIONS=--max-old-space-size=4096" >> $GITHUB_ENV

      - name: Install Rust Stable & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.2.8

      - name: Install Dependencies
        run: bun install

      - name: Run Prisma Generate
        run: bun run prisma:generate

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0-alpha"

      - name: Setup Keystore (Auto-generate for standalone builds)
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/upload-keystore.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass 106111 -keypass 106111 -dname "CN=Blinko, OU=Custom, O=Blinko, L=City, S=State, C=US"
          mkdir -p app/src-tauri/gen/android
          cat > app/src-tauri/gen/android/keystore.properties << EOF
          password=106111
          keyAlias=upload
          storeFile=$HOME/.android/upload-keystore.jks
          EOF

      - name: Build Android App
        run: |
          cd app
          bun run tauri:android:build
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Blinko-Custom-Android-APK
          path: app/src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
          retention-days: 14
